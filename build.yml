          @Mod.EventBusSubscriber(modid = ElytraRealism.MODID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public final class ClientModEvents {
              private ClientModEvents() {}

              @SubscribeEvent
